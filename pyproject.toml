[project]
name = "mlflow-optimization"
version = "0.1.0"
description = "Automatic MLflow logging of mathematical optimization solves"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
authors = [
    { name = "CoffeeGiNu" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow-skinny>=3.18.0",
]

[project.urls]
Repository = "https://github.com/CoffeeGiNu/mlflow-optimization"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "gurobipy>=14.0.0",
    "highspy>=1.16.0",
    "ortools>=9.15.6755",
    "pyomo>=6.10.1",
    "pyscipopt>=6.3.0",
    "pytest>=9.2.0",
    "ruff==0.17.3",
]
